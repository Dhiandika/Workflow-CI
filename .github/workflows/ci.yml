name: Workflow CI and Docker Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'MLProject/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas numpy matplotlib seaborn

    - name: Run MLflow Project (Re-train Model)
      run: |
        # Run training script directly within its expected directory to avoid Conda dependency checks on the runner
        cd MLProject
        python modelling.py

    - name: Find Latest Run and Model Artifacts
      id: model-vars
      run: |
        # Search recursively for the logged model directory
        model_path=$(find . -name "model" -type d | grep "artifacts/model" | head -n 1)
        if [ -z "$model_path" ]; then
          echo "Error: MLflow model directory not found!"
          exit 1
        fi
        echo "model_path=${model_path}" >> $GITHUB_ENV
        echo "Found model at: ${model_path}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image using MLflow
      run: |
        # Build the Docker image using local environment manager to avoid heavy conda rebuild issues
        mlflow models build-docker -m ${{ env.model_path }} -n npemburu6/heart-disease-rf:latest --env-manager=local

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker Image to Docker Hub
      run: |
        docker push npemburu6/heart-disease-rf:latest
