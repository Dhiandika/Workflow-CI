name: Workflow CI and Docker Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'MLProject/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas numpy matplotlib seaborn virtualenv

    - name: Run MLflow Project (Re-train Model)
      run: |
        mlflow run MLProject --env-manager=local

    - name: Find Latest Run and Model Artifacts
      id: model-vars
      run: |
        # Search recursively for the logged model directory and convert to an absolute path
        rel_path=$(find . -name "model" -type d | grep "artifacts/model" | head -n 1)
        if [ -z "$rel_path" ]; then
          echo "Error: MLflow model directory not found!"
          exit 1
        fi
        abs_model_path=$(realpath "$rel_path")
        echo "model_path=${abs_model_path}" >> $GITHUB_ENV
        echo "Found absolute model path at: ${abs_model_path}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image using MLflow
      run: |
        # Build a generic local image first (independent of secrets)
        export MLFLOW_LOG_LEVEL=DEBUG
        mlflow models build-docker -m ${{ env.model_path }} -n heart-disease-rf:latest --env-manager=local

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Tag and Push Docker Image
      run: |
        # Tag the local image with the Docker Hub username and push
        docker tag heart-disease-rf:latest ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-rf:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-rf:latest
